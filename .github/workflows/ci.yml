name: CI

on:
  push:
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          # Dummy values so env.ts validation passes in CI — no real DB is
          # contacted by the unit tests (models/services are mocked).
          MONGODB_URI: mongodb://localhost:27017/ci-placeholder
          OUTBOX_SECRET: ci-placeholder-secret-value
          AUTH_SECRET: ci-placeholder-auth-secret-value
          AUTH_GITHUB_ID: ci-placeholder-id
          AUTH_GITHUB_SECRET: ci-placeholder-secret
        run: npm test
