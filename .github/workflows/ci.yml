name: CI

on:
  push:
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          # A dummy value so env.ts validation passes in CI — no real DB is
          # contacted by the unit tests in this phase.
          MONGODB_URI: mongodb://localhost:27017/ci-placeholder
        run: npm test
